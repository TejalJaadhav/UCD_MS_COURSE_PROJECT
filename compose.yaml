services:
  claim-check:
    build:
      context: .
      target: runtime
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/examples:/inputs:ro
      - ./outputs/docker:/outputs
    command: ["python", "-m", "src.evaluation.check_claim", "--help"]
